<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 34'%3E%3Cpath d='M0 9 L20 0 L40 9 L40 14 L20 5 L0 14Z' fill='%2316a58f'/%3E%3Cpath d='M0 19 L20 10 L40 19 L40 24 L20 15 L0 24Z' fill='%231f8a87'/%3E%3Cpath d='M0 29 L20 20 L40 29 L40 34 L20 25 L0 34Z' fill='%2314687a'/%3E%3C/svg%3E">
<title>Prototipo PREVIA</title>
<meta name="description" content="Prototipo navegable de PREVIA, gestión de obras bajo incertidumbre. Datos ficticios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #12263a;        /* azul obra: texto y barra lateral */
  --ink-2: #4a5d6e;      /* texto secundario */
  --green: #16a58f;      /* acción principal */
  --green-d: #12806f;
  --petrol: #14687a;     /* acento secundario */
  --paper: #eef2f1;      /* fondo hormigón frío */
  --card: #ffffff;
  --line: #d5dddb;
  --ok: #1e9e5a;
  --warn: #d99a00;
  --bad: #cf4136;
  --ok-bg: #e3f4ea;
  --warn-bg: #fdf3d6;
  --bad-bg: #fbe5e2;
  --focus: #2f7fd1;
  --r-s: 4px;
  --r-m: 8px;
  font-size: 17px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Archivo", "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  line-height: 1.4;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-columns: 250px 1fr; height: 100%; }

/* ---------- barra lateral ---------- */
.side { background: var(--ink); color: #dbe6ee; display: flex; flex-direction: column; padding: 22px 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 24px 26px; font-weight: 800; font-size: 1.45rem; letter-spacing: .04em; color: #fff; }
.brand .chev { width: 34px; height: 30px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 24px; border: 0; background: none; text-align: left; color: #c3d2dd; border-left: 4px solid transparent; font-size: .98rem; }
.nav-item:hover { background: rgba(255,255,255,.05); }
.nav-item.on { color: #fff; background: rgba(22,165,143,.16); border-left-color: var(--green); font-weight: 600; }
.nav-item .count { margin-left: auto; background: var(--bad); color: #fff; font-size: .75rem; padding: 1px 7px; border-radius: 10px; }
.side-foot { margin-top: auto; padding: 0 24px; font-size: .85rem; color: #9fb3c2; }
.side-foot span { color: #6f8798; }

/* ---------- barra superior ---------- */
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.top { height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
.crumbs { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
.crumbs b { color: var(--ink); font-weight: 650; }
.crumbs .sep { color: #a9b6bd; }
.top-right { display: flex; align-items: center; gap: 18px; }
.bell { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink-2); display: grid; place-items: center; }
.bell svg { width: 22px; }
.bell .dot { position: absolute; top: 6px; right: 7px; width: 11px; height: 11px; border-radius: 50%; background: var(--bad); border: 2px solid #fff; }
.role { position: relative; }
.role-btn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: #fff; border-radius: 24px; padding: 4px 16px 4px 4px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--petrol); color: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 700; flex: none; }
.role-btn .who { text-align: left; line-height: 1.15; }
.role-btn .who small { display: block; color: var(--ink-2); font-size: .78rem; }
.role-menu { position: absolute; right: 0; top: 52px; width: 300px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: 0 12px 30px rgba(18,38,58,.16); padding: 8px; z-index: 30; }
.role-menu .hint { font-size: .8rem; color: var(--ink-2); padding: 6px 10px 8px; }
.role-opt { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: var(--r-s); text-align: left; }
.role-opt:hover, .role-opt.on { background: var(--paper); }
.role-opt small { display: block; color: var(--ink-2); font-size: .8rem; }

/* ---------- contenido ---------- */
#view { flex: 1; overflow: auto; padding: 28px 32px 40px; }
h1 { font-size: 1.7rem; margin: 0 0 4px; font-weight: 700; font-stretch: 90%; }
h2 { font-size: 1.15rem; margin: 0 0 14px; font-weight: 650; }
.sub { color: var(--ink-2); margin: 0 0 22px; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 20px 22px; }
.grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.stack > * + * { margin-top: 20px; }

.btn { border: 1px solid var(--line); background: #fff; border-radius: var(--r-s); padding: 9px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: #b7c4c1; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-d); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.small { padding: 5px 11px; font-size: .88rem; }
.btn[disabled] { opacity: .45; cursor: default; }

/* estados */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 12px; font-size: .85rem; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); background: var(--ok-bg); }
.chip.vence { color: #a87700; background: var(--warn-bg); }
.chip.nd { color: var(--bad); background: var(--bad-bg); }
.chip.info { color: var(--petrol); background: #e1eff2; }

/* tablas */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .82rem; color: var(--ink-2); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); }
td { padding: 11px 12px; border-bottom: 1px solid #e7ecea; }
td.num, th.num { text-align: right; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: #f6f9f8; }
tr.sel td { background: #eaf6f3 !important; }
tr.row-ok td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
tr.row-vence td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
tr.row-nd td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
tr.fresh td { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: #d8f1ea; } to { background: transparent; } }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }

/* barra de certeza */
.certeza { margin: 4px 0 22px; }
.certeza .bar { display: flex; height: 30px; border-radius: var(--r-s); overflow: hidden; }
.certeza .bar span { display: flex; align-items: center; padding-left: 10px; color: #fff; font-size: .85rem; font-weight: 600; white-space: nowrap; transition: flex-basis .6s; }
.certeza .s-ok { background: var(--ok); }
.certeza .s-vence { background: var(--warn); }
.certeza .s-nd { background: var(--bad); }
.certeza .legend { display: flex; gap: 26px; margin-top: 8px; font-size: .9rem; color: var(--ink-2); }
.certeza .legend b { color: var(--ink); }
.total-box { text-align: right; }
.total-box .big { font-size: 1.9rem; font-weight: 750; font-stretch: 85%; }

/* tarjetas de indicadores */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px 18px; }
.kpi .lab { color: var(--ink-2); font-size: .88rem; }
.kpi .val { font-size: 1.55rem; font-weight: 700; font-stretch: 88%; margin-top: 4px; transition: color .4s; }
.kpi .note { font-size: .8rem; color: var(--ink-2); margin-top: 2px; }
.kpi.upd .val { color: var(--green-d); }
.kpi.proj { border-color: var(--petrol); box-shadow: inset 0 3px 0 var(--petrol); }

/* alertas */
.alert { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-m); border: 1px solid; }
.alert.warn { background: var(--warn-bg); border-color: #efd27c; }
.alert.bad { background: var(--bad-bg); border-color: #f0b5ae; }
.alert .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--warn); flex: none; }
.alert.bad .ico { background: var(--bad); }
.alert .txt { flex: 1; }
.alert .txt small { display: block; color: var(--ink-2); }

/* formularios */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: .88rem; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid #c4cfcc; border-radius: var(--r-s); padding: 9px 12px; background: #fff; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--green); border-color: var(--green); }
.field textarea { min-height: 70px; resize: vertical; }
.row-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.check { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); margin-bottom: 8px; background: #fff; }
.check input { width: 18px; height: 18px; accent-color: var(--green); }
.check .grow { flex: 1; }

/* modal y panel lateral */
#overlay:empty { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(18,38,58,.42); display: grid; place-items: center; z-index: 40; }
.modal { width: 560px; background: #fff; border-radius: var(--r-m); padding: 24px 26px; box-shadow: 0 24px 60px rgba(18,38,58,.3); }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.drawer-scrim { position: fixed; inset: 0; background: rgba(18,38,58,.25); z-index: 40; }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 560px; background: #fff; box-shadow: -18px 0 40px rgba(18,38,58,.18); padding: 26px 28px; overflow: auto; z-index: 41; }
.drawer.anim { animation: slide .25s ease-out; }
@keyframes slide { from { transform: translateX(40px); } }
.drawer .close { float: right; border: 0; background: none; font-size: 1.4rem; color: var(--ink-2); }
dl.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; margin: 0 0 18px; }
dl.kv dt { color: var(--ink-2); }
dl.kv dd { margin: 0; font-weight: 600; }

/* archivos */
.file { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-s); margin-bottom: 8px; background: #fff; width: 100%; text-align: left; }
.file .xl { width: 34px; height: 40px; border-radius: 3px; background: #1d7a46; color: #fff; display: grid; place-items: center; font-size: .7rem; font-weight: 800; }
.file .pdf { background: #b8392f; }
.file:hover { border-color: var(--green); }
.progress { height: 8px; background: #e2e8e6; border-radius: 4px; overflow: hidden; margin: 14px 0 6px; }
.progress span { display: block; height: 100%; width: 0; background: var(--green); transition: width 1.1s ease-in-out; }

/* simulador */
.sim-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin: 14px 0 18px; }
.sim-val { border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px 14px; }
.sim-val .lab { font-size: .85rem; color: var(--ink-2); }
.sim-val .v { font-size: 1.35rem; font-weight: 700; font-stretch: 88%; transition: color .3s; }
.sim-val .d { font-size: .85rem; font-weight: 600; }
.down { color: var(--bad); }
.var-ctrl { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--paper); border-radius: var(--r-s); }
.var-ctrl input[type=range] { flex: 1; accent-color: var(--green); }
.var-ctrl .pct { width: 74px; text-align: right; font-weight: 700; font-size: 1.2rem; }

/* conversación */
.thread { border-left: 3px solid var(--line); padding-left: 16px; margin: 6px 0 16px; }
.msg { margin-bottom: 12px; }
.msg .meta { font-size: .82rem; color: var(--ink-2); }
.msg .body { background: var(--paper); border-radius: var(--r-m); padding: 10px 14px; margin-top: 4px; }
.msg.new .body { animation: fresh 1.6s ease-out; }

/* historial */
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { display: flex; gap: 14px; align-items: center; padding: 14px 6px; border-bottom: 1px solid #e7ecea; cursor: pointer; }
.timeline li:hover { background: #f6f9f8; }
.timeline .when { width: 120px; color: var(--ink-2); font-size: .88rem; }
.timeline .what { flex: 1; font-weight: 600; }
.timeline .what small { display: block; font-weight: 400; color: var(--ink-2); }

/* portales externos (proveedor y cliente) */
.portal { max-width: 980px; margin: 0 auto; }
.portal-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding: 14px 18px; background: #e1eff2; border-radius: var(--r-m); color: var(--petrol); font-weight: 600; }

/* vista móvil */
.phone-stage { display: grid; place-items: center; height: 100%; gap: 14px; }
.phone-stage .cap { color: var(--ink-2); font-size: .95rem; }
.phone { width: 400px; height: 820px; border-radius: 46px; background: #0f1c29; padding: 14px; box-shadow: 0 30px 60px rgba(18,38,58,.35); }
.screen { width: 100%; height: 100%; border-radius: 34px; background: #f3f6f5; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.m-top { background: var(--ink); color: #fff; padding: 38px 20px 16px; }
.m-top small { color: #9fb3c2; display: block; }
.m-top b { font-size: 1.2rem; }
.m-body { padding: 16px; flex: 1; overflow: auto; }
.m-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; display: block; width: 100%; text-align: left; }
.m-card b { display: block; }
.m-btn { width: 100%; padding: 14px; border-radius: 12px; border: 0; background: var(--green); color: #fff; font-weight: 700; font-size: 1.05rem; }
.m-field { margin-bottom: 12px; }
.m-field label { display: block; font-size: .85rem; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
.m-field input, .m-field select { width: 100%; padding: 11px 12px; border: 1px solid #c4cfcc; border-radius: 10px; background: #fff; font-size: 1rem; }
.m-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.m-photo { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px dashed #9fb0ad; border-radius: 10px; margin-bottom: 14px; background: #fff; width: 100%; }
.thumb { width: 54px; height: 54px; border-radius: 8px; background: linear-gradient(160deg, #a9b3b0, #7d8986); position: relative; overflow: hidden; }
.thumb::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; top: 10px; background: repeating-linear-gradient(90deg, #cfd5d3 0 8px, transparent 8px 14px); }
.m-ok { position: absolute; inset: 0; background: rgba(243,246,245,.96); display: grid; place-items: center; text-align: center; padding: 30px; }
.m-ok .tick { width: 74px; height: 74px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 2.4rem; display: grid; place-items: center; margin: 0 auto 14px; }

/* avisos emergentes */
#toasts { position: fixed; right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 60; }
.toast { background: var(--ink); color: #fff; padding: 13px 18px; border-radius: var(--r-m); box-shadow: 0 10px 30px rgba(18,38,58,.3); max-width: 460px; animation: pop .25s ease-out; }
.toast b { color: #7fe0cf; }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } }
.empty { text-align: center; padding: 50px 20px; color: var(--ink-2); }
.empty .btn { margin-top: 14px; }
.note-box { font-size: .88rem; color: var(--ink-2); background: var(--paper); border-radius: var(--r-s); padding: 10px 12px; margin: 10px 0 14px; }
.badge-step { display: inline-block; font-size: .8rem; color: var(--petrol); font-weight: 650; margin-bottom: 6px; }

/* tablas anchas: se desplazan dentro de su panel */
.panel { overflow-x: auto; }
.panel table { min-width: 560px; }

/* pantallas angostas (celular) */
@media (max-width: 860px) {
  :root { font-size: 15px; }
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
  .side, .main { min-width: 0; }
  .main { height: auto; }
  .side { flex-direction: row; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  .brand { padding: 0; font-size: 1.15rem; }
  .brand .chev { width: 26px; height: 22px; }
  #nav { flex-direction: row; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  .nav-item { white-space: nowrap; padding: 8px 12px; border-left: 0; border-bottom: 3px solid transparent; }
  .nav-item.on { border-left-color: transparent; border-bottom-color: var(--green); }
  .side-foot { display: none; }
  .top { height: auto; min-height: 60px; padding: 8px 16px; gap: 10px; flex-wrap: wrap; }
  .crumbs { flex-wrap: wrap; font-size: .9rem; min-width: 0; }
  .role-btn .who small { display: none; }
  #view { padding: 20px 16px 32px; overflow: visible; }
  .head-row { flex-direction: column; align-items: flex-start; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .grid2, .grid3, .sim-row, .row-fields { grid-template-columns: 1fr; }
  .modal { width: min(560px, calc(100vw - 32px)) !important; max-height: 90vh; overflow: auto; padding: 20px; }
  .drawer { width: 100vw; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  dl.kv { grid-template-columns: 1fr; gap: 2px; }
  dl.kv dd { margin-bottom: 8px; }
  .alert { flex-wrap: wrap; }
  .phone { width: min(400px, 100%); height: 760px; }
  .certeza .legend { flex-wrap: wrap; gap: 6px 18px; }
  #toasts { left: 16px; right: 16px; }
  .role-menu { right: -8px; width: min(300px, calc(100vw - 32px)); }
}

/* =========================================================
   Guía: bienvenida, recorrido guiado, modo «¿Por qué?» y glosario (guia.js)
   ========================================================= */
.top-btn { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 8px 15px; font-weight: 650; font-size: .9rem; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.top-btn:hover { border-color: #b7c4c1; }
.top-btn.tour { background: var(--green); border-color: var(--green); color: #fff; }
.top-btn.tour:hover { background: var(--green-d); }
.top-btn.on { background: var(--petrol); border-color: var(--petrol); color: #fff; }
/* con los botones nuevos, la ruta de navegación se recorta en lugar de pisarlos */
.top { gap: 16px; }
.crumbs { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; }
.crumbs > * { flex: none; }
.crumbs b { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.top-right { flex: none; }
.role-btn .who { white-space: nowrap; }
@media (min-width: 861px) { html, body { overflow: hidden; } }
@media (max-width: 1180px) and (min-width: 861px) { .top-btn .lg, .role-btn .who small { display: none; } }

/* dimensiones (mismos colores que las etiquetas D1 a D7 de los murales) */
.dims { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
.dim { font-size: .78rem; font-weight: 650; padding: 3px 9px; border-radius: 10px; color: #fff; background: var(--petrol); }
.dim-D1 { background: #ffe33b; color: #3d3400; }
.dim-D2 { background: #f07a2a; }
.dim-D3 { background: #2f9a10; }
.dim-D4 { background: #1593c0; }
.dim-D5 { background: #e0164f; }
.dim-D6 { background: #9a2fcb; }
.dim-D7 { background: var(--petrol); }

/* citas de evidencia */
blockquote.ev { margin: 8px 0; padding: 9px 12px 9px 14px; background: var(--paper); border-left: 4px solid var(--petrol); border-radius: 0 var(--r-s) var(--r-s) 0; font-size: .9rem; }
blockquote.ev-q { border-left-color: #d99a00; }

<script>
/* PREVIA, prototipo navegable. Sin dependencias.
   Cada elemento que usa el guion de grabación tiene un atributo data-qa.
   ?escena=N arranca con el estado al comienzo de esa escena (1 a 7). */
(() => {
  const D = window.PREVIA_DATA;
  const $ = (s, r = document) => r.querySelector(s);
  const money = (n) => "$ " + Math.round(n).toLocaleString("es-AR");
  const pct = (n, d = 1) => n.toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " %";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------------- estado ----------------
  const S = {
    role: "martin",
    view: "inicio",
    obra: null,                 // { nombre, m2, tipo }
    partidas: [],               // copia editable de D.partidas
    importando: false,
    modal: null,                // 'nuevaObra' | 'importar' | 'simulador' | 'evaluarMod'
    drawer: null,               // 'hierro' | 'cemento' | 'mod004'
    selRow: null,
    sim: { pct: 0, guardado: false },
    alertaHierro: false,
    solicitud: { enviada: false, provs: [] },
    oferta: null,               // oferta cargada por el proveedor
    ofertasRecibidas: false,
    ofertaSel: null,
    oc: null,
    comprometido: D.base.comprometido,
    pagado: D.base.pagado,
    avance: D.base.avance,
    cemento: { prev: D.base.cementoPrevisto, reg: D.base.cementoRegistrado },
    consumos: { arena: 18, hierro: 2860 },
    partes: [
      { fecha: "21/11", tarea: "Encofrado de columnas", por: "Ramón Ortiz", avance: "100 %" },
      { fecha: "20/11", tarea: "Armado de hierro columnas", por: "Ramón Ortiz", avance: "100 %" }
    ],
    mobile: "obras",            // 'obras' | 'obra' | 'parte' | 'ok'
    parteFoto: false,
    parteNuevo: false,
    expl: { estado: null, resp: "ramon", respuesta: null, accion: null },
    mod: { estado: null, adjunto: false, nuevoCosto: null }, // null | recibida | evaluando | enviada | aprobada
    notif: false,
    historial: [],
    fresh: {}
  };
  S.partidas = D.partidas.map((p) => ({ ...p }));

  // ---------------- cálculos ----------------
  const subtotal = (p) => p.cant * p.pu;
  const costoPartidas = () => S.partidas.reduce((a, p) => a + subtotal(p), 0);
  const modAprobada = () => (S.mod.estado === "aprobada" ? D.modificacion.nuevoCosto - D.modificacion.costoOriginal : 0);
  const precioVigente = () => D.precioOferta + modAprobada();
  const desvioCemento = () => Math.max(0, S.cemento.reg - S.cemento.prev) * D.base.bolsaCemento;
  const costoProyectado = () => costoPartidas() + desvioCemento();
  const certeza = () => {
    const t = { ok: 0, vence: 0, nd: 0 };
    S.partidas.forEach((p) => (t[p.estado] += subtotal(p)));
    return t;
  };
  const hierro = () => S.partidas.find((p) => p.id === "hierro");
  const simCosto = () => costoPartidas() + subtotal(hierro()) * S.sim.pct / 100;

  // ---------------- navegación ----------------
  const NAV = [
    ["inicio", "Inicio"],
    ["tablero", "Tablero de obra"],
    ["presupuesto", "Presupuesto"],
    ["compras", "Compras y proveedores"],
    ["partes", "Partes diarios"],
    ["control", "Control económico"],
    ["comunicacion", "Comunicación y decisiones"]
  ];
  const ROLES = {
    martin: { home: "inicio" },
    sofia: { home: "control" },
    ramon: { home: "movil" },
    proveedor: { home: "proveedor" },
    cliente: { home: "cliente" }
  };

  function renderNav() {
    const internal = S.role === "martin" || S.role === "sofia";
    $("#nav").innerHTML = internal
      ? NAV.map(([id, label]) => {
          const disabled = false;
          const count = id === "control" && alertasPendientes() > 0 ? `<span class="count">${alertasPendientes()}</span>` : "";
          return `<button class="nav-item ${S.view === id ? "on" : ""}" data-action="nav" data-to="${id}" data-qa="nav-${id}" ${disabled ? "disabled" : ""}>${label}${count}</button>`;
        }).join("")
      : `<div class="nav-item on">${S.role === "ramon" ? "PREVIA móvil" : "Portal externo"}</div>`;
    const p = D.personas[S.role];
    $("#role-btn").innerHTML = `<span class="avatar">${p.ini}</span><span class="who">${p.nombre}<small>${p.rol}</small></span>`;
    $("#role-menu").innerHTML = `<div class="hint">Ver el prototipo como</div>` + Object.entries(D.personas).map(([k, v]) =>
      `<button class="role-opt ${k === S.role ? "on" : ""}" data-action="role" data-role="${k}" data-qa="role-${k}"><span class="avatar">${v.ini}</span><span>${v.nombre}<small>${v.rol}${k === "ramon" ? ", vista móvil" : ""}</small></span></button>`
    ).join("");
    $("#bell-dot").hidden = !S.notif;
    const crumbs = [D.empresa];
    if (S.obra && !["inicio", "proveedor", "cliente"].includes(S.view)) crumbs.push(S.obra.nombre);
    const titles = Object.fromEntries(NAV);
    titles.movil = "Parte diario"; titles.proveedor = "Portal de proveedores"; titles.cliente = "Portal del cliente";
    crumbs.push(titles[S.view] || "");
    $("#crumbs").innerHTML = crumbs.map((c, i) => (i === crumbs.length - 1 ? `<b>${esc(c)}</b>` : `<span>${esc(c)}</span><span class="sep">/</span>`)).join("");
  }

  const alertasPendientes = () => (S.cemento.reg > S.cemento.prev && S.expl.estado !== "resuelta" ? 1 : 0);

  // ---------------- vistas ----------------
  const V = {};

  V.inicio = () => `
    <div class="head-row"><div><h1>Obras</h1><p class="sub">${D.empresa}. Hoy, ${D.hoy}.</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${S.obra ? "" : `<button class="btn" data-action="demo" data-qa="demo">Ver obra de ejemplo</button>`}<button class="btn primary" data-action="open-modal" data-modal="nuevaObra" data-qa="nueva-obra">+ Nueva obra</button></div></div>
    <div class="panel"><table>
      <thead><tr><th>Obra</th><th class="num">Superficie</th><th>Estado</th><th class="num">Avance</th><th class="num">Desvío final vs. presupuesto</th></tr></thead>
      <tbody>
        ${S.obra ? `<tr class="clickable fresh" data-action="nav" data-to="tablero"><td><b>${esc(S.obra.nombre)}</b></td><td class="num">${S.obra.m2} m²</td><td><span class="chip info">Presupuestando</span></td><td class="num">${S.avance} %</td><td class="num muted">en curso</td></tr>` : ""}
        ${D.obrasPrevias.map((o) => `<tr><td>${o.nombre}</td><td class="num">${o.m2} m²</td><td><span class="chip ${o.estado === "Terminada" ? "ok" : "info"}">${o.estado}</span></td><td class="num">${o.avance} %</td><td class="num">${o.desvio}</td></tr>`).join("")}
      </tbody></table>
      <p class="small muted" data-qa="memoria" style="margin:14px 0 0">Los desvíos de obras terminadas alimentan la memoria histórica que PREVIA usa como referencia al presupuestar.</p>
    </div>`;

  function certezaBar() {
    const c = certeza(), t = c.ok + c.vence + c.nd;
    const w = (v) => ((v / t) * 100).toFixed(1);
    return `<div class="certeza" data-qa="certeza">
      <div class="bar"><span class="s-ok" style="flex-basis:${w(c.ok)}%">${pct((c.ok / t) * 100, 0)}</span><span class="s-vence" style="flex-basis:${w(c.vence)}%">${pct((c.vence / t) * 100, 0)}</span><span class="s-nd" style="flex-basis:${w(c.nd)}%">${pct((c.nd / t) * 100, 0)}</span></div>
      <div class="legend"><span>Confirmado <b>${money(c.ok)}</b></span><span>Cotización por vencer <b>${money(c.vence)}</b></span><span>Sin definir <b>${money(c.nd)}</b></span></div>
    </div>`;
  }

    } else if (S.modal === "simulador") {
      const base = costoPartidas(), c = simCosto(), pv = precioVigente();
      const m0 = pv - base, m1 = pv - c;
      h = `<div class="scrim"><div class="modal" style="width:720px"><h2>Simular escenario</h2><p class="muted small">Probá variaciones antes de comprometer el precio. No modifica el presupuesto.</p>
        <div class="sim-row">
          <div class="sim-val"><div class="lab">Costo proyectado</div><div class="v" data-qa="sim-costo">${money(c)}</div><div class="d ${c > base ? "down" : "muted"}">${c > base ? "+" + money(c - base) : "Sin cambios"}</div></div>
          <div class="sim-val"><div class="lab">Margen previsto</div><div class="v ${m1 < m0 ? "down" : ""}">${money(m1)}</div><div class="d ${m1 < m0 ? "down" : "muted"}">${m1 < m0 ? "−" + money(m0 - m1) : "Sin cambios"}</div></div>
          <div class="sim-val"><div class="lab">Margen sobre precio</div><div class="v ${m1 < m0 ? "down" : ""}">${pct((m1 / pv) * 100)}</div><div class="d muted">Precio de oferta ${money(pv)}</div></div>
        </div>
        <div class="var-ctrl"><b>Precio del hierro</b>
          <button class="btn small" data-action="sim" data-d="-5" data-qa="sim-menos">−5 %</button>
          <input type="range" min="-20" max="40" step="1" value="${S.sim.pct}" data-qa="sim-range" id="sim-range">
          <button class="btn small" data-action="sim" data-d="5" data-qa="sim-mas">+5 %</button>
          <span class="pct" data-qa="sim-pct">${S.sim.pct > 0 ? "+" : ""}${S.sim.pct} %</span></div>
        <div class="actions" style="margin-top:18px"><button class="btn" data-action="close">Cerrar</button><button class="btn primary" data-action="guardar-escenario" data-qa="guardar-escenario">Guardar escenario</button></div></div></div>`;
    } else if (S.modal === "evaluarMod") {
      const m = D.modificacion;
      h = `<div class="scrim"><div class="modal" style="width:640px"><h2>Evaluar modificación ${m.numero}</h2><p class="muted small">Revestimiento del living, pedido por Carolina Ruiz.</p>
        <button class="file" data-action="adjuntar" data-qa="adjuntar-cot">${S.mod.adjunto ? `<span class="xl pdf">PDF</span><span><b>${m.adjunto}</b><br><span class="small muted">Adjuntado</span></span>` : `<span class="small">+ Adjuntar nueva cotización</span>`}</button>
        <div class="row-fields" style="margin-top:12px"><div class="field"><label>Costo original</label><input value="${money(m.costoOriginal)}" readonly></div>
          <div class="field"><label>Nuevo costo</label><input id="mod-nuevo" data-qa="mod-nuevo" placeholder="$"></div></div>
        <div class="row-fields"><div class="field"><label>Costo adicional</label><input id="mod-adicional" data-qa="mod-adicional" readonly placeholder="Se calcula solo"></div>
          <div class="field"><label>Impacto en plazo</label><select data-qa="mod-plazo"><option>Sin cambios</option><option>+1 semana</option><option>+2 semanas</option></select></div></div>
        <div class="actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="enviar-aprobacion" data-qa="enviar-aprobacion">Enviar para aprobación</button></div></div></div>`;
    }
    if (S.drawer) {
      const anim = S.drawer !== lastDrawer ? " anim" : "";
      h += `<div class="drawer-scrim" data-action="close-drawer"></div><div class="drawer${anim}">${drawerBody()}</div>`;
    }
    lastDrawer = S.drawer;
    $("#overlay").innerHTML = h;
  }

  function drawerBody() {
    const close = `<button class="close" data-action="close-drawer" data-qa="drawer-close" aria-label="Cerrar">×</button>`;
    if (S.drawer === "hierro") {
      const p = hierro(), c = D.cotizacionHierro;
      return `${close}<span class="badge-step">Partida</span><h2>${p.nombre}</h2>${estadoChip(p.estado)}
        <dl class="kv" style="margin-top:18px"><dt>Cantidad</dt><dd>${p.cant.toLocaleString("es-AR")} kg</dd><dt>Precio unitario</dt><dd>${money(p.pu)} por kg</dd><dt>Subtotal</dt><dd>${money(subtotal(p))}</dd>
        <dt>Cotización</dt><dd>${c.proveedor}, ${c.fecha}</dd><dt>Vence</dt><dd>${c.vence}, en 2 días</dd><dt>Peso en el costo</dt><dd>${pct((subtotal(p) / costoPartidas()) * 100)}</dd></dl>
        <div class="note-box" data-qa="memoria-hierro">${c.nota} Obras anteriores: el hierro subió en promedio 9 % entre la cotización y la compra.</div>
        <button class="btn primary" data-action="open-modal" data-modal="simulador" data-qa="simular">Simular escenario</button>`;
    }
    if (S.drawer === "cemento") {
      const dif = S.cemento.reg - S.cemento.prev;
      const e = S.expl;
      return `${close}<span class="badge-step">Alerta de consumo</span><h2>Consumo de cemento superior al previsto</h2>
        <dl class="kv"><dt>Previsto acumulado</dt><dd>${S.cemento.prev} bolsas</dd><dt>Registrado</dt><dd>${S.cemento.reg} bolsas</dd>
        <dt>Diferencia</dt><dd class="down">+${dif} bolsas (+${Math.round((dif / S.cemento.prev) * 100)} %)</dd><dt>Impacto estimado</dt><dd>${money(desvioCemento())}</dd><dt>Tarea</dt><dd>Hormigonado de columnas</dd></dl>
        <div class="note-box" data-qa="nota-causa">La alerta muestra una diferencia, no su causa. La causa la determina el equipo.</div>
        ${!e.estado ? `<div class="field"><label>Pedir explicación a</label><select id="resp" data-qa="resp-select"><option value="">Elegí un responsable</option><option value="ramon">Ramón Ortiz, capataz</option><option value="martin">Martín Herrera, dueño</option></select></div>
          <button class="btn primary" data-action="solicitar-expl" data-qa="solicitar-explicacion">Solicitar explicación</button>` : `
          <div class="thread">
            <div class="msg"><div class="meta">Sofía Benítez a Ramón Ortiz</div><div class="body">¿Por qué se usaron 15 bolsas más de cemento en las columnas?</div></div>
            ${e.respuesta ? `<div class="msg new"><div class="meta">Ramón Ortiz, desde el celular</div><div class="body">${esc(e.respuesta)}</div></div>` : `<div class="msg"><div class="meta muted">Esperando respuesta de Ramón Ortiz</div></div>`}
            ${e.accion ? `<div class="msg new"><div class="meta">Acción correctiva registrada por Sofía Benítez</div><div class="body">${esc(e.accion)}</div></div>` : ""}
          </div>
          ${e.respuesta && !e.accion ? `<div class="field"><label>Acción correctiva</label><textarea id="accion" data-qa="accion"></textarea></div><button class="btn primary" data-action="registrar-accion" data-qa="registrar-accion">Registrar acción</button>` : ""}`}`;
    }
    const h = S.historial.find((x) => x.id === S.drawer);
    if (h) return `${close}<span class="badge-step">Historial de decisiones</span><h2>${h.titulo}</h2><dl class="kv">${h.kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
    return close;
  }

  // ---------------- render ----------------
  function render() {
    renderNav();
    $("#view").innerHTML = (V[S.view] || V.inicio)();
    renderOverlay();
    S.fresh = {};
    hooks.forEach((f) => f());
  }
  const hooks = [];
  function toast(html, ms = 3200) {
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = html;
    $("#toasts").appendChild(t);
    setTimeout(() => t.remove(), ms);
  }
  const later = (ms, fn) => setTimeout(() => { fn(); render(); }, ms);

  function addHist(id, titulo, detalle, estado, chip, kv) {
    if (!S.historial.find((h) => h.id === id)) S.historial.push({ id, cuando: D.hoy, titulo, detalle, estado, chip, kv });
  }

  // ---------------- acciones ----------------
  const A = {
    nav: (el) => {
      if (!S.obra && el.dataset.to !== "inicio") cargarEjemplo();
      S.view = el.dataset.to; S.drawer = null; S.showHist = false;
    },
    demo: () => { cargarEjemplo(); S.view = "presupuesto"; },
    "toggle-roles": () => { const m = $("#role-menu"); m.hidden = !m.hidden; return false; },
    role: (el) => {
      $("#role-menu").hidden = true;
      S.role = el.dataset.role; S.drawer = null; S.modal = null;
      if (S.role === "martin" && S.solicitud.enviada && S.oferta && !S.oc) { S.view = "compras"; S.ofertasRecibidas = true; }
      else if (S.role === "martin" && S.mod.estado === "aprobada") { S.view = "comunicacion"; }
      else if (S.role === "martin" && S.view === "proveedor") S.view = "compras";
      else S.view = ROLES[S.role].home;
      if (S.role === "martin" && S.expl.estado === "resuelta" && !S.mod.estado) {
        S.mod.estado = "recibida"; S.notif = true; S.view = "control";
        setTimeout(() => toast("<b>Nueva solicitud del cliente</b><br>Carolina Ruiz, Vivienda Los Álamos"), 500);
      }
      if (S.role === "sofia") S.fresh.consumo = S.parteNuevo;
    },
    bell: () => { S.notif = false; S.view = "comunicacion"; },
    "open-modal": (el) => { S.modal = el.dataset.modal; if (S.modal === "simulador") S.drawer = null; },
    close: () => { S.modal = null; },
    "close-drawer": () => { S.drawer = null; S.selRow = null; },
    "crear-obra": () => {
      const nombre = $("#f-nombre").value.trim() || "Obra sin nombre";
      S.obra = { nombre, m2: parseInt($("#f-m2").value, 10) || 0, tipo: $("#f-tipo").value };
      S.modal = null; S.view = "presupuesto";
      toast(`<b>Obra creada</b><br>${esc(nombre)}`);
    },
    "importar-archivo": () => {
      S.importando = true;
      setTimeout(() => { const b = $("#imp-bar"); if (b) b.style.width = "100%"; }, 60);
      later(1300, () => { S.importando = false; S.modal = null; S.importado = true; S.fresh.tabla = true; toast("<b>Presupuesto importado</b><br>10 partidas. 3 necesitan atención."); });
    },
    row: (el) => { if (el.dataset.id === "hierro") { S.selRow = "hierro"; S.drawer = "hierro"; } },
    drawer: (el) => { S.drawer = el.dataset.d; },
    sim: (el) => { S.sim.pct = Math.max(-20, Math.min(40, S.sim.pct + parseInt(el.dataset.d, 10))); },
    "guardar-escenario": () => {
      S.sim.guardado = true; S.modal = null; S.alertaHierro = true; S.selRow = null;
      toast(`<b>Escenario guardado</b><br>Hierro ${S.sim.pct > 0 ? "+" : ""}${S.sim.pct} %: margen ${pct(margenPct(simCosto()))}`);
    },
    "go-compras": () => { S.view = "compras"; },
    prov: (el) => {
      const id = el.dataset.id, l = S.solicitud.provs;
      S.solicitud.provs = el.checked ? [...new Set([...l, id])] : l.filter((x) => x !== id);
    },
    "enviar-solicitud": () => { S.solicitud.enviada = true; toast(`<b>Solicitud enviada</b><br>A ${S.solicitud.provs.length} proveedores`); },
    "enviar-oferta": () => {
      const pu = parseInt(($("#of-precio").value || "").replace(/\D/g, ""), 10) || 3310;
      S.oferta = { pu, entrega: $("#of-entrega").value || "28/11", validez: $("#of-validez").value };
      const o = D.proveedoresHierro.find((p) => p.id === "oeste"); o.pu = pu; o.entrega = S.oferta.entrega; o.validez = S.oferta.validez;
      toast("<b>Oferta enviada</b><br>Constructora Herrera fue notificada");
    },
    "sel-oferta": (el) => { S.ofertaSel = el.dataset.id; },
    "generar-oc": () => {
      const o = D.proveedoresHierro.find((p) => p.id === S.ofertaSel);
      S.oc = { numero: "OC-0012", proveedor: o.nombre, pu: o.pu, total: o.pu * 800 };
      S.comprometido += S.oc.total; S.fresh.comp = true;
      const h = hierro(); h.pu = o.pu; h.estado = "ok"; h.fuente = `${S.oc.numero}, ${o.nombre}`;
      addHist("hierro", "Cotización de hierro actualizada", `${o.nombre}, ${money(o.pu)} por kg. ${S.oc.numero} por ${money(S.oc.total)}.`, "Comprometido", "ok",
        [["Decidió", "Martín Herrera, dueño"], ["Proveedor", o.nombre], ["Precio", `${money(o.pu)} por kg`], ["Orden de compra", `${S.oc.numero}, ${money(S.oc.total)}`], ["Ofertas comparadas", "3"]]);
      toast(`<b>Orden de compra ${S.oc.numero} generada</b><br>${money(S.oc.total)} comprometidos en Hierro`);
    },
    m: (el) => { S.mobile = el.dataset.to; },
    "m-foto": () => { S.parteFoto = true; keepMobileFields(); },
    "m-enviar": () => {
      const v = (id) => parseFloat(($("#" + id).value || "0").replace(",", ".")) || 0;
      S.cemento.reg += v("m-cemento"); S.consumos.arena += v("m-arena"); S.consumos.hierro += v("m-hierro");
      S.avance = Math.min(100, S.avance + 1);
      S.partes.unshift({ fecha: "24/11", tarea: $("#m-tarea").value || "Sin tarea", por: "Ramón Ortiz", avance: (v("m-avance") || 0) + " %" });
      S.parteNuevo = true; S.mobile = "ok";
    },
    "solicitar-expl": () => {
      if (!$("#resp").value) { toast("Elegí un responsable para pedir la explicación."); return; }
      S.expl.estado = "pedida";
      toast("<b>Explicación solicitada</b><br>Ramón Ortiz fue notificado en el celular");
      later(1800, () => { S.expl.estado = "respondida"; S.expl.respuesta = "Se reforzaron las columnas del eje B por indicación de la dirección de obra. Además se mojaron 4 bolsas en el acopio por la lluvia del jueves."; });
    },
    "registrar-accion": () => {
      S.expl.accion = $("#accion").value.trim() || "Acción registrada";
      S.expl.estado = "resuelta";
      addHist("cemento", "Desvío de cemento investigado", "+15 bolsas en columnas. Causa identificada y acción correctiva registrada.", "Resuelto", "ok",
        [["Detectado", "Alerta de consumo, 24/11/2026"], ["Investigó", "Sofía Benítez, jefa de obra"], ["Explicó", "Ramón Ortiz, capataz"], ["Causa", "Refuerzo de columnas eje B y 4 bolsas mojadas"], ["Acción", esc(S.expl.accion)], ["Impacto", money(desvioCemento())]]);
      toast("<b>Acción correctiva registrada</b>");
    },
    adjuntar: () => { S.mod.adjunto = true; const n = $("#mod-nuevo").value; setTimeout(() => { $("#mod-nuevo").value = n; calcAdicional(); }, 0); },
    "enviar-aprobacion": () => {
      S.mod.estado = "enviada"; S.modal = null;
      toast("<b>Enviada para aprobación</b><br>Carolina Ruiz recibirá el detalle");
    },
    "aceptar-mod": () => {
      S.mod.estado = "aprobada";
      const r = S.partidas.find((p) => p.id === "revest");
      r.pu += D.modificacion.nuevoCosto - D.modificacion.costoOriginal;
      addHist("mod004", "Modificación #004 aprobada por el cliente", "Revestimiento del living, porcelanato premium. +$ 1.200.000, plazo sin cambios.", "Aprobada", "ok",
        [["Solicitó", "Carolina Ruiz, cliente, 24/11/2026 09:15"], ["Evaluó", "Martín Herrera, dueño, 24/11/2026 11:02"], ["Aprobó", "Carolina Ruiz, cliente, 24/11/2026 18:40"],
         ["Impacto económico", "+$ 1.200.000"], ["Impacto en plazo", "Sin cambios"], ["Documentación", D.modificacion.adjunto], ["Presupuesto vigente", money(precioVigente())]]);
      toast("<b>Aprobación registrada</b>");
    },
    historial: () => { S.showHist = true; }
  };

  function cargarEjemplo() {
    S.obra = { nombre: "Vivienda Los Álamos", m2: 250, tipo: "Vivienda unifamiliar" };
    S.importado = true; S.fresh.tabla = true;
    toast("<b>Obra de ejemplo cargada</b><br>Vivienda Los Álamos, 250 m². Usá el menú de la izquierda para recorrerla.");
  }

  // conserva lo tipeado en el formulario móvil al volver a dibujar
  function keepMobileFields() {
    const ids = ["m-tarea", "m-cemento", "m-arena", "m-hierro", "m-personal", "m-avance"];
    const vals = Object.fromEntries(ids.map((i) => [i, $("#" + i)?.value]));
    setTimeout(() => ids.forEach((i) => { if ($("#" + i) && vals[i] != null) $("#" + i).value = vals[i]; }), 0);
  }
  function calcAdicional() {
    const n = parseInt(($("#mod-nuevo")?.value || "").replace(/\D/g, ""), 10);
    const a = $("#mod-adicional");
    if (a) a.value = n ? money(n - D.modificacion.costoOriginal) : "";
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) { if (!e.target.closest(".role")) $("#role-menu").hidden = true; return; }
    if (el.matches("input[type=checkbox]")) return; // lo maneja 'change'
    if (el.hasAttribute("disabled")) return;
    const fn = A[el.dataset.action];
    if (!fn) return;
    if (fn(el) === false) return;
    render();
  });
  document.addEventListener("change", (e) => {
    if (e.target.matches("[data-action=prov]")) { A.prov(e.target); render(); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "sim-range") { S.sim.pct = parseInt(e.target.value, 10); const keep = document.activeElement === e.target; render(); if (keep) $("#sim-range").focus(); }
    if (e.target.id === "mod-nuevo") calcAdicional();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { S.modal = null; S.drawer = null; render(); } });

  // ---------------- presets por escena ----------------
  function preset(n) {
    const run = (k) => n > k;
    if (run(1) || n === 1) { /* nada: escena 1 arranca de cero */ }
    if (n >= 2) { S.obra = { nombre: "Vivienda Los Álamos", m2: 250, tipo: "Vivienda unifamiliar" }; S.importado = true; S.view = "presupuesto"; S.selRow = "hierro"; S.drawer = "hierro"; }
    if (n >= 3) { S.sim = { pct: 15, guardado: true }; S.alertaHierro = true; S.drawer = null; S.selRow = null; S.view = "compras"; }
    if (n >= 4) {
      S.solicitud.enviada = true; S.solicitud.provs = ["sur", "oeste", "sm"]; S.oferta = { pu: 3310, entrega: "28/11", validez: "10 días" }; S.ofertasRecibidas = true; S.ofertaSel = "oeste";
      const o = D.proveedoresHierro.find((p) => p.id === "oeste");
      S.oc = { numero: "OC-0012", proveedor: o.nombre, pu: 3310, total: 2648000 }; S.comprometido += 2648000;
      const h = hierro(); h.pu = 3310; h.estado = "ok"; h.fuente = "OC-0012, Metalúrgica Oeste";
      addHist("hierro", "Cotización de hierro actualizada", "Metalúrgica Oeste, $ 3.310 por kg. OC-0012 por $ 2.648.000.", "Comprometido", "ok",
        [["Decidió", "Martín Herrera, dueño"], ["Proveedor", "Metalúrgica Oeste"], ["Precio", "$ 3.310 por kg"], ["Orden de compra", "OC-0012, $ 2.648.000"], ["Ofertas comparadas", "3"]]);
      S.role = "ramon"; S.view = "movil";
    }
    if (n >= 5) { S.cemento.reg = 115; S.consumos.arena += 2; S.consumos.hierro += 120; S.avance = 18; S.parteNuevo = true;
      S.partes.unshift({ fecha: "24/11", tarea: "Hormigonado de columnas", por: "Ramón Ortiz", avance: "75 %" }); S.role = "sofia"; S.view = "control"; }
    if (n >= 6) { S.expl = { estado: "resuelta", resp: "ramon", respuesta: "Se reforzaron las columnas del eje B por indicación de la dirección de obra. Además se mojaron 4 bolsas en el acopio por la lluvia del jueves.", accion: "Acopiar el cemento bajo techo y ajustar la previsión de las columnas del eje C." };
      addHist("cemento", "Desvío de cemento investigado", "+15 bolsas en columnas. Causa identificada y acción correctiva registrada.", "Resuelto", "ok",
        [["Detectado", "Alerta de consumo, 24/11/2026"], ["Investigó", "Sofía Benítez, jefa de obra"], ["Explicó", "Ramón Ortiz, capataz"], ["Causa", "Refuerzo de columnas eje B y 4 bolsas mojadas"], ["Acción", "Acopiar el cemento bajo techo y ajustar la previsión de las columnas del eje C."], ["Impacto", "$ 450.000"]]); }
    if (n >= 7) { S.role = "cliente"; S.mod.estado = "enviada"; S.mod.adjunto = true; A["aceptar-mod"](); S.role = "martin"; S.view = "comunicacion"; S.notif = false; }
  }
  const fromHash = (location.hash.match(/(?:escena|tour)-(\d)/) || [])[1];
  const n = parseInt(fromHash || new URLSearchParams(location.search).get("escena") || "1", 10);
  if (n > 1) preset(n);
  window.addEventListener("hashchange", () => { if (/escena-\d/.test(location.hash)) location.reload(); });
  // la guía (guia.js) usa estos accesos: recorrido, modo «¿Por qué?», glosario y bienvenida
  window.PREVIA = { state: S, render, actions: A, preset, toast, cargarEjemplo, scene: n, onRender: (f) => hooks.push(f) };
  render();
})();

</script>
<script>
/* PREVIA, capa de guía: bienvenida, recorrido guiado, modo «¿Por qué?» y glosario.
   Usa window.PREVIA (app.js). No modifica la lógica del prototipo: solo la recorre y la explica.
   Las citas salen de los murales del equipo (testeos del mural 12 y mapas empáticos del mural 06).
   En la página pública se muestra el rol de cada entrevistado, no su nombre. */
(() => {
  const P = window.PREVIA;
  if (!P) return;
  const S = P.state;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const narrow = () => window.innerWidth < 860;

  // ---------------- contenido ----------------
  const DIMS = {
    D1: "Precisión del presupuesto inicial",
    D2: "Negocio rentable",
    D3: "Control de gastos",
    D4: "Relación comercial",
    D5: "Tareas en tiempo y forma",
    D6: "Adaptarse a los cambios",
    D7: "Asumir responsabilidad sobre lo que está bajo su control"
  };
  const SRC = {
    p1: "Testeo del prototipo 1, presupuestación (mural 12)",
    p2: "Testeo del prototipo 2, presupuesto compartido (mural 12)",
    p3: "Testeo del prototipo 3, tablero de obra (mural 12)",

  function wrapTerms(root) {
    if (!root) return;
    const used = new Set();
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => {
        const p = n.parentElement;
        if (!p || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        if (p.closest("select, option, input, textarea, abbr, script, style, .m-ok")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const m = node.nodeValue.match(GLRE);
      if (!m) return;
      const key = m[1].toLowerCase().replace(/\s+/g, " ");
      const g = GLMAP[key];
      if (!g || used.has(g.title)) return;
      used.add(g.title);
      const after = node.splitText(m.index);
      after.splitText(m[1].length);
      const ab = document.createElement("abbr");
      ab.className = "gl"; ab.tabIndex = 0; ab.dataset.gl = key; ab.textContent = after.nodeValue;

        { target: '[data-qa="prov-lista"]', text: "Cada proveedor muestra su historial de entregas. Marcá al menos dos, incluida <b>Metalúrgica Oeste</b>.",
          skip: () => S.solicitud.enviada, done: () => S.solicitud.provs.includes("oeste") && S.solicitud.provs.length >= 2,
          auto: () => { S.solicitud.provs = ["sur", "oeste", "sm"]; P.render(); } },
        { target: '[data-qa="enviar-solicitud"]', text: "Tocá <b>Enviar solicitud</b>.", done: () => S.solicitud.enviada },
        ...roleSteps("proveedor", "un proveedor"),
        { target: '[data-qa="enviar-oferta"]', text: "Ahora sos Metalúrgica Oeste. Cargamos tu oferta: $ 3.310 por kg. Tocá <b>Enviar oferta</b>.",
          prep: () => { fill("#of-precio", "3310"); fill("#of-entrega", "28/11"); const v = $("#of-validez"); if (v && v.dataset.tour !== "1") { v.value = "10 días"; v.dataset.tour = "1"; } },
          done: () => !!S.oferta },
        ...roleSteps("martin", "el dueño"),
        { target: ['[data-qa="oferta-oeste"]', '[data-qa="ofertas"]'], text: "Las ofertas llegan comparables. Elegí la de <b>Metalúrgica Oeste</b>.", done: () => !!S.ofertaSel },
        { target: '[data-qa="generar-oc"]', text: "Tocá <b>Generar orden de compra</b>. El monto pasa a costo comprometido y el hierro queda confirmado.", done: () => !!S.oc }
      ] },
    { title: "Conocer lo que pasa en la obra", who: "ramon", d: ["D5", "D3"],
      intro: "Ramón, el capataz, registra el día de trabajo desde el celular.",
      f: "Registrar en el momento, sin planillas aparte.", e: "Que su trabajo quede visible para la jefa de obra y el dueño.",
      ev: [WHY.parte.ev[1], WHY.parte.ev[0]],
      steps: [
        ...roleSteps("ramon", "el capataz, en el celular"),
        { target: '[data-qa="m-obra"]', text: "Ramón abre su obra.", done: () => S.mobile !== "obras" },
        { target: '[data-qa="m-nuevo-parte"]', text: "Tocá <b>+ Nuevo parte diario</b>.", done: () => S.mobile === "parte" || S.mobile === "ok" },
        { target: '[data-qa="m-enviar"]', text: "Cargamos el parte de hoy: 15 bolsas de cemento, 2 m³ de arena, 120 kg de hierro, 6 operarios y 75 % de avance. Podés sumar una foto. Tocá <b>Enviar parte</b>.",
          prep: () => { const t = $("#m-tarea"); if (t && !t.value) t.value = "Hormigonado de columnas"; fill("#m-cemento", "15"); fill("#m-arena", "2"); fill("#m-hierro", "120"); fill("#m-personal", "6"); fill("#m-avance", "75"); },
          done: () => S.mobile === "ok" },
        { target: '[data-qa="m-ok"]', next: true, text: "Listo: el consumo de materiales y el avance se actualizan solos para la jefa de obra." }
      ] },
    { title: "Detectar un desvío y coordinar una respuesta", who: "sofia", d: ["D3", "D7"],
      intro: "Sofía, la jefa de obra, ve que el consumo de cemento superó lo previsto.",
      f: "Actuar antes de que el desvío crezca.", e: "Sentir el control de lo que sí depende del equipo.",
      ev: [WHY.alertaCemento.ev[0], WHY.causa.ev[1]],
      steps: [
        ...roleSteps("sofia", "la jefa de obra"),
        { target: '[data-qa="alerta-cemento"]', next: true, text: "Apareció una alerta: el cemento registrado supera lo previsto para las columnas." },
        { target: '[data-qa="ver-detalle-cemento"]', text: "Tocá <b>Ver detalle</b>.", done: () => S.drawer === "cemento" },
        { target: '[data-qa="nota-causa"]', next: true, text: "La alerta muestra una diferencia, no su causa. <b>PREVIA no diagnostica</b>: la causa la determinan las personas." },
        { target: '[data-qa="solicitar-explicacion"]', text: "Pedile la explicación a Ramón. Ya lo elegimos como responsable: tocá <b>Solicitar explicación</b>.",
          prep: () => { const r = $("#resp"); if (r && !r.value) r.value = "ramon"; }, done: () => !!S.expl.estado },
        { target: ['[data-qa="registrar-accion"]', '[data-qa="nota-causa"]'], text: "Ramón responde desde la obra (tarda unos segundos). Después tocá <b>Registrar acción</b>: ya escribimos la acción correctiva.",
          prep: () => fill("#accion", "Acopiar el cemento bajo techo y ajustar la previsión de las columnas del eje C."), done: () => S.expl.estado === "resuelta" }
      ] },
    { title: "Gestionar una modificación del cliente", who: "martin", d: ["D4", "D6"],
      intro: "Carolina, la cliente, pide porcelanato premium en el living. El cambio se cotiza y ella lo aprueba antes de que se ejecute.",
      f: "Que el costo del cambio quede claro y aprobado.", e: "No sentir que se defrauda al cliente cuando lo acordado cambia.",
      ev: [WHY.modificacion.ev[0], WHY.modificacion.ev[1]],
      steps: [
        ...roleSteps("martin", "el dueño"),
        { target: '[data-qa="bell"]', text: "Llegó una solicitud de la cliente. Tocá la <b>campana</b>.", skip: () => S.view === "comunicacion" || S.mod.estado !== "recibida", done: () => S.view === "comunicacion" },
        { target: '[data-qa="evaluar-mod"]', text: "Tocá <b>Evaluar modificación</b>.", done: () => S.modal === "evaluarMod" || (S.mod.estado && S.mod.estado !== "recibida") },
        { target: '[data-qa="adjuntar-cot"]', text: "Martín adjunta la cotización del porcelanato premium.", skip: () => S.mod.estado !== "recibida", done: () => S.mod.adjunto },
        { target: '[data-qa="enviar-aprobacion"]', text: "Nuevo costo: $ 4.200.000, o sea $ 1.200.000 más, sin cambio de plazo. Tocá <b>Enviar para aprobación</b>.",
          prep: () => fill("#mod-nuevo", "4200000"), done: () => S.mod.estado === "enviada" || S.mod.estado === "aprobada" },
        ...roleSteps("cliente", "la cliente"),
        { target: '[data-qa="aceptar-mod"]', text: "Carolina ve el costo adicional antes de que se ejecute. Tocá <b>Aceptar modificación y costo adicional</b>.", done: () => S.mod.estado === "aprobada" }
      ] },
    { title: "Recuperar las decisiones", who: "martin", d: ["D7", "D4"],
      intro: "Al final, todo lo que se decidió queda registrado en la obra.",
      f: "Tener respaldo de cada compromiso.", e: "Que la credibilidad no dependa de que todo salga según lo previsto.",
      ev: [WHY.historial.ev[0], WHY.historial.ev[1]],
      steps: [
        ...roleSteps("martin", "el dueño"),
        { target: '[data-qa="nav-tablero"]', text: "Abrí el <b>Tablero de obra</b> en el menú.", done: () => S.view === "tablero" },
        { target: '[data-qa="historial"]', text: "Tocá <b>Historial de decisiones</b>.", done: () => !!S.showHist },
        { target: ['[data-qa="hist-mod004"]', '[data-qa="timeline"]'], text: "Las tres decisiones quedaron registradas. Tocá la <b>modificación #004</b>.", done: () => S.drawer === "mod004" },
        { target: ".drawer", next: true, text: "Quién la pidió, quién la evaluó, quién la aprobó, cuándo y con qué impacto." }
      ] }
  ];

  // T = { ch: índice de escena (0 a 6), i: -1 = tarjeta de la escena, 0.. = paso; intro: tarjeta general }
  let T = null, lastKey = null;
  const card = document.createElement("div");
  card.id = "tour-card"; card.hidden = true; card.setAttribute("role", "dialog"); card.setAttribute("aria-live", "polite");
  const spot = document.createElement("div");
  spot.className = "tour-spot"; spot.hidden = true;
  const dim = document.createElement("div");
  dim.className = "tour-dim"; dim.hidden = true;
  document.body.append(dim, spot, card);
  card.addEventListener("click", (e) => e.stopPropagation());

  function go(hash) { location.hash = hash; location.reload(); }
  function setHash(ch) { history.replaceState(null, "", location.pathname + location.search + "#tour-" + (ch + 1)); }
  function startTour(ch, intro) {
    setWhy(false);
    T = { ch, i: -1, intro: !!intro };
    setHash(ch); lastKey = null; tick();
  }
  function endTour() {
    T = null; card.hidden = true; spot.hidden = true; dim.hidden = true;
    history.replaceState(null, "", location.pathname + location.search);
  }
  const step = () => (T && T.i >= 0 ? CH[T.ch].steps[T.i] : null);
  function nextStep() {
    if (!T) return;
    if (T.intro) { T.intro = false; T.i = -1; lastKey = null; return; }
    T.i++;
    if (T.i >= CH[T.ch].steps.length) {
      if (T.ch < CH.length - 1) { T.ch++; T.i = -1; setHash(T.ch); }
      else { T.i = CH[T.ch].steps.length; }
    }
    lastKey = null;
  }
  // desplaza solo el contenedor que corresponde (no la página entera, que en escritorio no scrollea)
  function scrollToEl(el) {
    const box = el.closest("#view, .drawer, .m-body, .modal");
    const r = el.getBoundingClientRect();
    if (box && box.scrollHeight > box.clientHeight + 2 && !(narrow() && box.id === "view")) {
      const b = box.getBoundingClientRect();
      if (r.top < b.top + 20 || r.bottom > b.bottom - 20) box.scrollBy({ top: r.top - b.top - (b.height - r.height) / 2, behavior: "smooth" });
    } else if (r.top < 70 || r.bottom > window.innerHeight - 20) {
      window.scrollBy({ top: r.top - (window.innerHeight - r.height) / 2, behavior: "smooth" });
    }
  }
  function findTarget(sel) {
    for (const s of [].concat(sel || [])) {
      const el = $(s);
      if (el && el.getClientRects().length && el.getBoundingClientRect().width > 0) return el;
    }
    return null;
  }

  const dots = () => `<div class="dots">${CH.map((c, k) => `<button class="dot ${T && k === T.ch ? "on" : ""} ${T && k < T.ch ? "done" : ""}" data-ch="${k}" title="Escena ${k + 1}: ${esc(c.title)}" aria-label="Ir a la escena ${k + 1}"></button>`).join("")}</div>`;
  function cardHtml() {
    const c = CH[T.ch];
    const head = `<div class="tc-head"><span class="tc-kick">${T.intro ? "Recorrido guiado" : `Escena ${T.ch + 1} de ${CH.length}`}</span>${dots()}<button class="x" data-t="exit" aria-label="Salir del recorrido">×</button></div>`;
    if (T.intro) {
      return head + `<h3>Así funciona PREVIA, de punta a punta</h3>
        <p>Vas a seguir una obra ficticia, la Vivienda Los Álamos, en <b>7 escenas</b> (unos 3 minutos). En cada una hacés la acción vos: te marcamos qué tocar, y si preferís, PREVIA lo hace por vos.</p>
        <div class="kick">El punto de vista que guía el prototipo</div>
        <blockquote class="ev ev-pov">${esc(POV)}<cite>Punto de vista del equipo (mural 07)</cite></blockquote>
        <p class="small muted">Cada escena muestra qué necesidad resuelve, qué dimensión ataca y de qué entrevista o testeo salió.</p>
        <div class="tc-foot"><button class="btn" data-t="exit">Ahora no</button><button class="btn primary" data-t="next">Empezar</button></div>`;
    }
    if (T.i === -1) {
      const p = window.PREVIA_DATA.personas[c.who];
      return head + `<h3>${esc(c.title)}</h3>
        <div class="who"><span class="avatar">${p.ini}</span><span>${esc(p.nombre)}<small>${esc(p.rol)}</small></span></div>
        <p>${esc(c.intro)}</p>
        <div class="dims">${dimChips(c.d)}</div>
        <dl class="needs"><dt>Necesidad funcional</dt><dd>${esc(c.f)}</dd><dt>Necesidad emocional</dt><dd>${esc(c.e)}</dd></dl>
        <div class="kick">De dónde salió</div>${evHtml(c.ev)}
        <div class="tc-foot"><button class="link" data-t="restart">Reiniciar escena</button><button class="btn primary" data-t="next">${T.ch === 0 ? "Empezar la escena" : "Seguir"}</button></div>`;
    }
    if (T.i >= c.steps.length) {
      return head + `<h3>Recorrido terminado</h3>
        <p>Viste cómo PREVIA acompaña la obra desde el presupuesto hasta las decisiones: la incertidumbre a la vista, los riesgos simulados, las compras vinculadas, el parte diario, los desvíos con responsable, los cambios aprobados y el historial.</p>
        <p>Activá <b>«¿Por qué?»</b>, arriba, para ver de qué necesidad del trabajo de campo sale cada función. O explorá libremente con el menú de la izquierda y el selector de persona.</p>
        <div class="tc-foot"><button class="link" data-t="again">Repetir el recorrido</button><button class="btn" data-t="why">Activar «¿Por qué?»</button><button class="btn primary" data-t="exit">Explorar libremente</button></div>`;
    }
    const st = step();
    return head + `<div class="tc-step">${esc(c.title)}</div><p class="tc-text">${st.text}</p>
      ${st.next ? "" : `<p class="tc-wait">Tocá el elemento resaltado para seguir.</p>`}
      <div class="tc-foot"><button class="link" data-t="restart">Reiniciar escena</button>
      ${st.next ? `<button class="btn primary" data-t="next">Siguiente</button>` : `<button class="btn" data-t="auto">Hacerlo por mí</button>`}</div>`;
  }

  card.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || !T) return;
    if (b.dataset.ch) { go("tour-" + (parseInt(b.dataset.ch, 10) + 1)); return; }
    const t = b.dataset.t;
    if (t === "exit") endTour();
    else if (t === "next") { nextStep(); tick(); }
    else if (t === "restart") go("tour-" + (T.ch + 1));
    else if (t === "again") go("tour-1");
    else if (t === "why") { endTour(); setWhy(true); }
    else if (t === "auto") { const st = step(); if (st) (st.auto || (() => click([].concat(st.target)[0])))(); setTimeout(tick, 120); }
  });

  function tick() {
    if (!T) return;
    // pasos que ya se cumplieron o no aplican
    let guard = 0;
    while (T && T.i >= 0 && guard++ < 40) {
      const st = step();
      if (!st) break;
      if ((st.skip && st.skip()) || (!st.next && st.done && st.done())) { nextStep(); continue; }
      break;
    }
    const st = step();
    const key = T.intro ? "intro" : `${T.ch}:${T.i}`;
    if (key !== lastKey) {
      card.innerHTML = cardHtml();
      lastKey = key;
      const el = st && findTarget(st.target);
      if (el) scrollToEl(el);
    }
    if (st && st.prep) st.prep();
    place(st);
  }

  function place(st) {
    card.hidden = false;
    const el = st && findTarget(st.target);
    const isCard = !st;
    dim.hidden = !isCard && !!el;
    card.classList.toggle("center", isCard || (!el && !narrow()));
    card.classList.toggle("sheet", !isCard && narrow());
    if (!el) { spot.hidden = true; card.style.left = card.style.top = ""; return; }
    const r = el.getBoundingClientRect(), pad = 6;
    spot.hidden = false;
    Object.assign(spot.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
    if (narrow()) { card.style.left = card.style.top = ""; return; }
    const vw = window.innerWidth, vh = window.innerHeight, cw = card.offsetWidth, chh = card.offsetHeight, m = 16;
    let x, y;
    if (r.right + m + cw < vw - m) { x = r.right + m; y = r.top; }
    else if (r.left - m - cw > m) { x = r.left - m - cw; y = r.top; }
    else if (r.bottom + m + chh < vh - m) { x = r.left; y = r.bottom + m; }
    else if (r.top - m - chh > m) { x = r.left; y = r.top - m - chh; }
    else { x = vw - cw - m; y = vh - chh - m; }
    x = Math.max(m, Math.min(x, vw - cw - m)); y = Math.max(m, Math.min(y, vh - chh - m));
    card.style.left = x + "px"; card.style.top = y + "px";
  }
  setInterval(tick, 250);
  window.addEventListener("resize", () => { if (T) place(step()); });

  // botón del recorrido en la barra superior
  $("#btn-tour").addEventListener("click", (e) => {
    e.stopPropagation();
    hideWelcome();
    if (!S.obra && S.role === "martin") startTour(0, true);
    else go("tour-1");
  });

  // ---------------- bienvenida ----------------
  const ROLE_CARDS = [
    ["martin", "Presupuesta con información incompleta, simula riesgos y compra."],
    ["sofia", "Controla lo planificado contra lo ejecutado y gestiona los desvíos."],
    ["ramon", "Carga el parte diario desde el celular."],
    ["proveedor", "Responde pedidos de cotización desde su portal."],
    ["cliente", "Aprueba los cambios y su costo antes de que se ejecuten."]
  ];
  const welcome = document.createElement("div");
  welcome.id = "welcome"; welcome.hidden = true;
  welcome.innerHTML = `<div class="wel" role="dialog" aria-labelledby="wel-t">
    <div class="wel-brand"><svg viewBox="0 0 40 34" aria-hidden="true"><path d="M0 9 L20 0 L40 9 L40 14 L20 5 L0 14Z" fill="#16a58f"/><path d="M0 19 L20 10 L40 19 L40 24 L20 15 L0 24Z" fill="#1f8a87"/><path d="M0 29 L20 20 L40 29 L40 34 L20 25 L0 34Z" fill="#14687a"/></svg>PREVIA</div>
    <h2 id="wel-t">Previsibilidad de costos para constructoras pyme</h2>
    <p>Prototipo navegable del Equipo 03 (A360 Estrategias de Innovación, UdeSA). Todo funciona con una obra ficticia, la Vivienda Los Álamos, y datos inventados.</p>
    <div class="wel-cta"><button class="btn primary big" data-w="tour">▶ Hacer el recorrido guiado<small>7 escenas, unos 3 minutos</small></button><button class="btn big" data-w="free">Explorar por mi cuenta<small>Con la obra de ejemplo cargada</small></button></div>
    <div class="kick">O entrá directamente como…</div>
    <div class="wel-roles">${ROLE_CARDS.map(([r, t]) => { const p = window.PREVIA_DATA.personas[r]; return `<button class="wel-role" data-w="rol" data-r="${r}"><span class="avatar">${p.ini}</span><b>${esc(p.nombre)}</b><small>${esc(p.rol)}</small><span>${esc(t)}</span></button>`; }).join("")}</div>
    <p class="small muted wel-tip">Tip: con <b>«¿Por qué?»</b>, arriba, ves de qué entrevista o testeo sale cada función. Los términos subrayados tienen su explicación.</p>
  </div>`;
  document.body.appendChild(welcome);
  function hideWelcome() { welcome.hidden = true; }
  welcome.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (e.target === welcome) { hideWelcome(); return; }
    if (!b) return;
    e.stopPropagation();
    if (b.dataset.w === "tour") { hideWelcome(); startTour(0, true); }
    else if (b.dataset.w === "free") { hideWelcome(); if (!S.obra) { P.cargarEjemplo(); S.view = "presupuesto"; P.render(); } }
    else if (b.dataset.w === "rol") go("rol-" + b.dataset.r);
  });

  // ---------------- arranque ----------------
  function enterAs(r) {
    if (r === "martin") { P.cargarEjemplo(); S.view = "presupuesto"; }
    else if (r === "sofia") P.preset(5);
    else if (r === "ramon") P.preset(4);
    else if (r === "proveedor") { P.preset(3); S.solicitud.enviada = true; S.solicitud.provs = ["sur", "oeste", "sm"]; S.role = "proveedor"; S.view = "proveedor"; }
    else if (r === "cliente") { P.preset(6); S.mod.estado = "enviada"; S.mod.adjunto = true; S.role = "cliente"; S.view = "cliente"; }
    else return;
    const p = window.PREVIA_DATA.personas[r];
    P.render();
    P.toast(`<b>Estás viendo PREVIA como ${esc(p.nombre)}</b><br>${esc(p.rol)}. Cambiá de persona con el menú de arriba a la derecha.`, 6000);
  }

  P.onRender(() => { applyWhy(); wrapTerms($("#view")); wrapTerms($("#overlay")); });
  applyWhy(); wrapTerms($("#view"));

  const h = location.hash;
  const mTour = h.match(/^#tour-(\d)$/), mRol = h.match(/^#rol-(\w+)$/);
  if (navigator.webdriver) return; // las grabaciones del video no muestran la guía
  if (mTour) startTour(Math.min(CH.length, Math.max(1, parseInt(mTour[1], 10))) - 1, mTour[1] === "1");
  else if (mRol) { history.replaceState(null, "", location.pathname + location.search); enterAs(mRol[1]); }
  else if (P.scene === 1) welcome.hidden = false;
})();

</script>
</body>
</html>
